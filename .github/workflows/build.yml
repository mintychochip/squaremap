name: Build
on:
  push:
    branches: "**"
    tags-ignore: [ "**" ]
  pull_request:
  release:
    types: [ released ]
jobs:
  rust-backend:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - name: "checkout git repository"
        uses: actions/checkout@v7
      - name: "setup rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: "build Rust backend"
        run: cargo build --manifest-path rust/Cargo.toml -p squaremap-server --release --target ${{ matrix.target }}
      - name: "stage Rust backend"
        shell: bash
        run: |
          mkdir -p "rust/backend/${{ matrix.target }}"
          binary="squaremap-server${{ endsWith(matrix.target, '-windows-msvc') && '.exe' || '' }}"
          cp "rust/target/${{ matrix.target }}/release/$binary" \
            "rust/backend/${{ matrix.target }}/squaremap-server-${{ matrix.target }}${{ endsWith(matrix.target, '-windows-msvc') && '.exe' || '' }}"
      - name: "upload Rust backend"
        uses: actions/upload-artifact@v7
        with:
          name: rust-backend-${{ matrix.target }}
          path: rust/backend/${{ matrix.target }}/
  publish-rust-backends:
    if: ${{ github.event_name == 'release' }}
    needs: rust-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "download Rust backend artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: rust-backend-*
          path: rust/backend
          merge-multiple: false
      - name: "publish Rust backend release assets"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: rust/backend/**/squaremap-server*
          fail_on_unmatched_files: true
  build:
    needs: rust-backend
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: "checkout git repository"
        uses: actions/checkout@v7
      - name: "download Rust backend artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: rust-backend-x86_64-unknown-linux-gnu
          path: rust/backend
          merge-multiple: true
      - name: "stage host Rust backend"
        shell: bash
        run: |
          mkdir -p rust/target/release
          test -f rust/backend/squaremap-server-x86_64-unknown-linux-gnu
          cp rust/backend/squaremap-server-x86_64-unknown-linux-gnu \
            rust/target/release/squaremap-server
      - name: "setup bun"
        uses: oven-sh/setup-bun@v2
      - name: "install bun dependencies"
        run: cd web && bun install
      - name: "lint frontend"
        run: cd web && bun run lint
      - name: "setup jdk"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: "setup gradle"
        uses: gradle/actions/setup-gradle@v6
        # gradle-build-action doesn't support caching files in the project dir
      - name: "cache project local caches"
        uses: actions/cache@v6
        with:
          path: |
            .gradle/loom-cache
            fabric/.gradle/loom-cache
            paper/.gradle/caches/paperweight
            common/build/moddev
            neoforge/build/moddev
            sponge/build/moddev
          key: ${{ runner.os }}-project-local-gradle-caches-${{ hashFiles('**/libs.versions.toml', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-project-local-gradle-caches-
      - name: "execute gradle build"
        run: ./gradlew build
      - name: "determine status"
        run: |
          PROPERTIES="$(./gradlew properties)"
          if [ "$(echo "$PROPERTIES" | awk '/^version:/ { print $2; }' | grep '\-SNAPSHOT')" ]; then
            echo "STATUS=snapshot" >> "$GITHUB_ENV"
          else
            echo "STATUS=release" >> "$GITHUB_ENV"
          fi
          PUBLISH_API="$(awk -F= '/^publishApi=/ { print $2; }' gradle.properties)"
          echo "PUBLISH_API=${PUBLISH_API:-true}" >> "$GITHUB_ENV"
      - name: "publish snapshot to sonatype snapshots"
        if: "${{ env.STATUS != 'release' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}"
        run: ./gradlew publishAllPublicationsToSonatypeSnapshots
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: "${{ secrets.SONATYPE_USERNAME }}"
          ORG_GRADLE_PROJECT_sonatypePassword: "${{ secrets.SONATYPE_PASSWORD }}"
      - name: "publish release to maven central"
        if: "${{ env.STATUS == 'release' && env.PUBLISH_API == 'true' && github.event_name == 'release' }}"
        run: ./gradlew publishReleaseCentralPortalBundle
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: "${{ secrets.SONATYPE_USERNAME }}"
          ORG_GRADLE_PROJECT_sonatypePassword: "${{ secrets.SONATYPE_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.SIGNING_PASSWORD }}"
      - name: "publish release to modrinth"
        if: "${{ env.STATUS == 'release' && github.event_name == 'release' }}"
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: "${{ secrets.MODRINTH_TOKEN }}"
          RELEASE_NOTES: "${{ github.event.release.body }}"
      - name: "publish release to hangar"
        if: "${{ env.STATUS == 'release' && github.event_name == 'release' }}"
        run: ./gradlew publishAllPublicationsToHangar
        env:
          HANGAR_UPLOAD_KEY: "${{ secrets.HANGAR_UPLOAD_KEY }}"
          RELEASE_NOTES: "${{ github.event.release.body }}"
      - name: "publish release to ore"
        if: "${{ env.STATUS == 'release' && github.event_name == 'release' }}"
        run: ./gradlew publishDefaultPublicationToOre
        env:
          ORE_TOKEN: "${{ secrets.ORE_TOKEN }}"
          RELEASE_NOTES: "${{ github.event.release.body }}"
      - name: "upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: "build/libs/*.jar"
