[package]
name = "squaremap-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
fs2 = "0.4.3"
cap-std = "4.0.2"
base64 = "0.22.1"
hex.workspace = true
prost.workspace = true
rand = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tokio = { workspace = true, features = ["net", "time", "rt-multi-thread", "macros", "sync", "signal", "process"] }
zeroize = "1.8.1"
squaremap-protocol = { path = "../squaremap-protocol" }
squaremap-render = { path = "../squaremap-render" }
squaremap-state = { path = "../squaremap-state" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.16", features = ["client-legacy", "http1", "tokio"] }
tokio-tungstenite = "0.28.0"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "=0.3.31"
tokio-util = { version = "0.7.16", features = ["io"] }
libc.workspace = true
[dev-dependencies]
tempfile.workspace = true
criterion = "0.5.1"
squaremap-compare = { path = "../squaremap-compare" }

[[bench]]
name = "backend_workload"
harness = false
[[bench]]
name = "backend_end_to_end"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
